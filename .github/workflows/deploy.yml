name: Refresh and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Tuesdays 10:00 UTC (after Monday Night Football) during the season
    - cron: "0 10 * * 2"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest Sleeper data
        run: python -I tools/fetch_sleeper.py 1319022882948403200
      - name: Fetch any new team logos
        run: python -I tools/fetch_logos.py
      - name: Build site data
        run: python -I tools/build_site_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
